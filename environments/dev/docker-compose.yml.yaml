version: "3.9"
name: fair-dev
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 11235813
      POSTGRES_DB: FairGame
    ports:
      - "127.0.0.1:10001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
  redis:
    image: redis:8.10
    command: /bin/sh -c "redis-server --requirepass 11235813"
    environment:
      REDIS_HOST_PASSWORD: 11235813
    ports:
      - "127.0.0.1:10003:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data: