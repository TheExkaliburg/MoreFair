# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  schedule:
    - cron: '21 7 * * 1'
  workflow_dispatch:

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: |
          set +e
          pnpm exec eslint src/ \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif
          status=$?
          set -e
          # Preserve report-only lint findings, but fail on tool/configuration errors.
          if [ "$status" -eq 1 ]; then
            echo "::warning::ESLint reported lint findings; see the SARIF report."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          test -s eslint-results.sarif

      - name: Upload analysis results to GitHub
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: frontend/eslint-results.sarif
          wait-for-processing: true
