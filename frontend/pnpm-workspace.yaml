overrides:
  parse-url@<8.1.0: '>=8.1.0'
  loader-utils@>=2.0.0 <2.0.3: '>=2.0.3'
  loader-utils@>=2.0.0 <2.0.4: '>=2.0.4'
publicHoistPattern: 
  - '*'
autoInstallPeers: true
strictPeerDependencies: false
allowBuilds:
  '@intlify/vue-i18n-bridge': true
  '@intlify/vue-router-bridge': true
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
# Replace deprecated Nuxt Kit loaders until nuxt-windicss includes the fix.
patchedDependencies:
  nuxt-windicss@3.0.1: patches/nuxt-windicss@3.0.1.patch
